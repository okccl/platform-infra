# platform-team 共通ツール定義（source of truth）
# 他リポジトリは extends で参照する
# クローン時は platform-infra と同階層に配置すること

[tools]
kubectl = "1.35.3"                                                                   # Kubernetes CLI
helm    = "3.20.1"                                                                   # Helm パッケージマネージャ
k3d     = "5.8.3"                                                                    # ローカル k3s クラスタ管理
argocd  = "3.2.9"                                                                    # ArgoCD CLI
sops    = "3.12.2"                                                                   # Secret 暗号化
age     = "1.3.1"                                                                    # Age 暗号鍵管理
"ubi:argoproj/argo-rollouts" = { version = "1.8.3", exe = "kubectl-argo-rollouts" } # Argo Rollouts kubectl プラグイン
"github:hatoo/oha" = "1.14.0"                                                        # HTTP 負荷テスト
gh      = "2.87.2"                                                                   # GitHub CLI
